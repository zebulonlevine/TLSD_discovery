# GO enrichment (decoupler v2). Versions as installed (conda list, 2026-10-23).
# Originally created with: conda create -n dc python=3.11 decoupler-py -c conda-forge
name: dc
channels:
  - conda-forge
dependencies:
  - python=3.11.15
  - decoupler-py=2.1.6
  - numba=0.65.1
  - pandas=2.3.3
  - numpy=2.4.6
  - scipy=1.17.1
  - statsmodels=0.14.6
  - matplotlib-base=3.11.0
  - anndata=0.12.19
  - pyyaml=6.0.3
