# Versions as installed in the analysis environment (conda list, 2026-10-23).
name: crispri-screen
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.13
  - mageck=0.5.9.5
  - pandas=2.3.3
  - numpy=2.4.6
  - scipy=1.16.3
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - biopython=1.86
  - pyyaml=6.0.3
  - adjusttext=1.4.0
  - itables=2.8.1
  - statsmodels=0.14.6
  - gseapy=1.3.0
  - pillow=12.1.0
  - openpyxl=3.1.5   # added: writes the .xlsx supplementary tables (absent from the original env)
