# Proteomics analysis and figures (proteomics/*.py). Versions as installed (conda list, 2026-10-23;
# the analysis ran in the mageck env, which has the same versions).
name: proteomics
channels:
  - conda-forge
dependencies:
  - python=3.12.12
  - numpy=2.2.5
  - pandas=2.3.3
  - scipy=1.16.3
  - matplotlib=3.10.7
  - seaborn=0.13.2
  - openpyxl=3.1.5
